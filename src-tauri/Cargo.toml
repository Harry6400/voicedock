[package]
name = "voicedock"
version = "0.1.1"
description = "A floating macOS voice creation workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "voicedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "macos-system-configuration"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
base64 = "0.22"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm"] }
ogg = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
